name: Unit Tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        # Only the lightweight subset needed by src/utils.py — no torch/transformers
        run: |
          pip install \
            numpy \
            scikit-learn \
            rouge-score \
            pytest

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
